<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF2A7"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#F6E27A"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Badge Shield -->
  <g filter="url(#badgeShadow)">
    <path d="M 200,20 L 360,70 C 360,260 200,420 200,420 C 200,420 40,260 40,70 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="8"/>
    <path d="M 200,32 L 345,78 C 345,250 200,402 200,402 C 200,402 55,250 55,78 Z" fill="#F9FAF8" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- Green Top Banner -->
  <path d="M 70,85 Q 200,60 330,85 L 330,135 Q 200,110 70,135 Z" fill="url(#greenGrad)"/>
  <text x="200" y="112" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    ECOGREEN RECYCLERS
  </text>
  <text x="200" y="128" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#A5D6A7" text-anchor="middle" letter-spacing="1.5">
    GREATER NOIDA &#8226; PAN-INDIA
  </text>

  <!-- Central Star & Laurels -->
  <g transform="translate(200, 215)">
    <!-- Golden Leaf Wreath Left -->
    <path d="M -70,20 C -95,-10 -85,-50 -60,-80 C -65,-55 -55,-25 -40,-5 Z" fill="url(#goldGrad)"/>
    <path d="M -60,-20 C -80,-50 -65,-85 -40,-110 C -45,-85 -35,-55 -25,-35 Z" fill="url(#goldGrad)"/>
    <!-- Golden Leaf Wreath Right -->
    <path d="M 70,20 C 95,-10 85,-50 60,-80 C 65,-55 55,-25 40,-5 Z" fill="url(#goldGrad)"/>
    <path d="M 60,-20 C 80,-50 65,-85 40,-110 C 45,-85 35,-55 25,-35 Z" fill="url(#goldGrad)"/>

    <!-- Central Medal Circle -->
    <circle cx="0" cy="-20" r="55" fill="url(#goldGrad)" filter="url(#badgeShadow)"/>
    <circle cx="0" cy="-20" r="48" fill="#1B5E20"/>
    <circle cx="0" cy="-20" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Leaf Icon inside medal -->
    <path d="M 0,-50 C 25,-40 30,-15 15,0 C -5,15 -25,5 -20,-20 C -20,-35 -10,-45 0,-50 Z" fill="#A5D6A7"/>
    <path d="M 0,-48 Q 5,-15 -15,0" stroke="#1B5E20" stroke-width="2" fill="none"/>
    <text x="0" y="18" font-family="'Outfit', Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      GreenCo
    </text>
  </g>

  <!-- Rating Typography -->
  <text x="200" y="285" font-family="'Outfit', Arial, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
    GOLD RATED
  </text>
  <text x="200" y="310" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">
    ENVIRONMENTAL EXCELLENCE
  </text>

  <!-- 3 Gold & 2 Silver Tagline -->
  <rect x="80" y="330" width="240" height="28" rx="14" fill="#E8F5E9" stroke="#81C784" stroke-width="1"/>
  <text x="200" y="349" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1B5E20" text-anchor="middle" letter-spacing="0.5">
    3 GOLD &#8226; 2 SILVER CERTIFIED PLANTS
  </text>

  <!-- CII Audit Accreditation -->
  <text x="200" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle">
    Confederation of Indian Industry (CII)
  </text>
  <text x="200" y="396" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#9CA3AF" text-anchor="middle">
    Sohrabji Godrej Green Business Centre &#8226; 2025–2028
  </text>
</svg>
