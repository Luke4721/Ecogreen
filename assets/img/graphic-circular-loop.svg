<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Closed-loop recovery: materials returned to manufacturing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(150 150)">
    <circle r="128" fill="none" stroke="#00b140" stroke-opacity=".12" stroke-width="1.5"/>
    <circle r="104" fill="none" stroke="#00b140" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="5 9"/>

