  <style>.egSym{font:700 26px 'Rajdhani',sans-serif;fill:#17301f}.egNm{font:600 11px 'DM Sans',sans-serif;fill:#17301f;fill-opacity:.72;letter-spacing:.06em}</style>
  <g>
