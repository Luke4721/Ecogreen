<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" width="340" height="190" role="img" aria-label="Closed-loop paper and fibre recovery" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(170 95)">
    <g fill="none" stroke="#17301f" stroke-opacity=".22" stroke-width="2" stroke-dasharray="4 8">
      <ellipse rx="140" ry="72"/>
    </g>
    <!-- sheet stack -->
    <g transform="translate(-46 -40)">
      <rect width="92" height="78" rx="7" fill="#17301f" fill-opacity=".08" stroke="#17301f" stroke-opacity=".35" stroke-width="2" transform="translate(14 14)"/>
      <rect width="92" height="78" rx="7" fill="#17301f" fill-opacity=".12" stroke="#17301f" stroke-opacity=".5" stroke-width="2" transform="translate(7 7)"/>
      <rect width="92" height="78" rx="7" fill="#ffffff" fill-opacity=".55" stroke="#17301f" stroke-width="2.5"/>
      <g stroke="#17301f" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
        <path d="M16 22h60M16 36h60M16 50h38"/>
